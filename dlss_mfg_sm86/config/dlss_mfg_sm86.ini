; dlss_mfg_sm86 -- multi-frame generation for dlssg_sm86 in games without an MFG UI.
; Edits apply while the game runs (within a second). Turning frame generation
; on/off and Reflex stay with the game. More keys: README, "Advanced keys".

[FrameGeneration]
; 1 = NVIDIA Dynamic MFG (the runtime picks the multiplier)
; 2 = fixed 2x/3x/4x from the primary display's refresh rate
; 3 = experimental governor: most generated frames, then dynamic resolution
; 0 = off (pass-through)
Mode=2
; Modes 1 and 3: output FPS target. 0 = the display refresh rate.
TargetFPS=0
; Mode 2: 2x up to LowRefreshMaxHz, 3x up to MediumRefreshMaxHz, 4x above.
LowRefreshMaxHz=60
MediumRefreshMaxHz=90

[Mode3]
; 1 = frames first: the most generated frames that keep the base rate
;     (target / multiplier) at or above MinBaseFPS. Frees the most CPU.
; 0 = latency first: the fewest generated frames that reach the target.
Prefer=1
MinBaseFPS=30
; Upper limit, in generated frames (1 = 2x, 2 = 3x, 3 = 4x).
MaxGeneratedFrames=3
; Unreal games: use the GPU time left at that base rate for resolution.
; 1 = the engine's dynamic resolution. Set the range once: changing
;     MaxScreenPercentage or switching it on mid-game can leave the 3D scene
;     frozen until the next resolution change.
; 2 = step between DLSS levels (Ultra Performance .. Quality), for games whose
;     DLSS setting ignores 1 (AC8). Last resort.
; 0 = off.
DynamicResolution=0
MinScreenPercentage=33
MaxScreenPercentage=67
; GPU time to use (rendering + frame generation), percent of the base frame time.
BudgetPercent=100

[ConsoleVariables]
; Unreal games: console variables to pin while the game runs (name=value,
; integers as 1, floats as 1.0). Memory only; removing a line unpins it.

[Logging]
; dlss_mfg_sm86.log next to this file.
Enabled=1
