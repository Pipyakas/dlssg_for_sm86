; dlssg_sm86 settings for Ninja Gaiden 2 Black. Keys left out take dlssg_sm86's
; validated defaults; the full list is in docs\INSTALL.en.md at the fork root.

[General]
Enabled=1

[FrameGeneration]
; 3 = fastest tier (lossy kernels). 1 = output bit-identical to NVIDIA's runtime.
Optimized=3
; Ceiling the runtime reports to the game: 3 generated frames = 4x.
MaxGeneratedFrames=3

[Compatibility]
Preset=Auto

[Logging]
Level=3
Directory=dlssg_sm86\logs

[Runtime]
Mode=Bundled
