name: Sync upstream

# The fork is one commit on top of upstream main, adding only .github/ and
# dlss_mfg_sm86/. Forks get no event when upstream pushes, so poll; when upstream
# has moved, rebase that commit onto it and force-push.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/sdli1995/dlssg_for_sm86.git

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: compare
        run: |
          head=$(git ls-remote "$UPSTREAM_URL" refs/heads/main | cut -f1)
          echo "upstream main: $head"
          if [ -n "$head" ] && ! git merge-base --is-ancestor "$head" HEAD 2>/dev/null; then
            echo changed=true >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase the fork commit onto upstream
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM_URL"
          git fetch --quiet --no-tags upstream main
          old=$(git rev-parse HEAD)
          if git rebase upstream/main; then
            git push --force-with-lease="$BRANCH:$old" origin "HEAD:$BRANCH"
            git log --oneline -3
          else
            git rebase --abort
            gh label create upstream-sync --color c5def5 --description 'Upstream sync needs attention' 2>/dev/null || true
            gh issue create --label upstream-sync \
              --title "Upstream $(git rev-parse --short upstream/main): rebase conflict" \
              --body "Rebasing the fork commit onto upstream $(git rev-parse upstream/main) conflicted, so the fork was left unchanged. Upstream likely started using a path under .github/ or dlss_mfg_sm86/. Rebase locally and force-push."
            exit 1
          fi
